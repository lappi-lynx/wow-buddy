[package]
name = "wow-buddy"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["router", "document"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[lib]
name = "wow_buddy"
path = "src/lib.rs"

[[bin]]
name = "wow-buddy"
path = "src/main.rs"
