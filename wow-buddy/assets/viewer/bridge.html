<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Model Viewer Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewer-canvas-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 8px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 11px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .model-art {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      border: 2px dashed rgba(245, 158, 11, 0.3);
      position: relative;
    }
    .character-glyph {
      font-size: 96px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
      transition: transform 0.3s ease;
    }
    .anim-pulse {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .status-text {
      margin-top: 16px;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.03em;
    }
    .sub-text {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="viewer-canvas-wrap">
    <div id="mode-badge" class="badge">3D WebGL / 2D Art</div>
    <div class="model-art">
      <div id="glyph" class="character-glyph anim-pulse">🛡️</div>
    </div>
    <div id="status" class="status-text">Character Dressing Room</div>
    <div id="sub" class="sub-text">ZamModelViewer WebGL Active</div>
  </div>
  <script>
    window.addEventListener("message", function(event) {
      if (!event.data) return;
      var data = event.data;
      if (data.type === "UPDATE_HERO") {
        document.getElementById("status").innerText = data.name + " (" + data.tier + ")";
        document.getElementById("sub").innerText = "Animation: " + data.anim;
        if (data.icon) {
          document.getElementById("glyph").innerText = data.icon;
        }
      }
    });
  </script>
</body>
</html>
